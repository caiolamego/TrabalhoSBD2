# ==============================================
# Docker Compose Override - Development
# ==============================================
# Este arquivo é carregado automaticamente pelo Docker Compose
# para sobrescrever configurações específicas de desenvolvimento

services:
  # ==============================================
  # AIRFLOW WEBSERVER - Development Overrides
  # ==============================================
  airflow-webserver:
    environment:
      # Debug mode para desenvolvimento
      AIRFLOW__WEBSERVER__RELOAD_ON_PLUGIN_CHANGE: 'true'
      AIRFLOW__WEBSERVER__DEBUG: 'true'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      # Logs mais verbosos
      AIRFLOW__LOGGING__LOGGING_LEVEL: 'DEBUG'
    volumes:
      # Mount code em tempo real para hot reload
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./spark_config:/opt/airflow/spark_config
    ports:
      - "8081:8080"

  # ==============================================
  # AIRFLOW SCHEDULER - Development Overrides
  # ==============================================
  airflow-scheduler:
    environment:
      AIRFLOW__LOGGING__LOGGING_LEVEL: 'DEBUG'
      # Processamento mais rápido para desenvolvimento
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 60
      AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: 'false'

  # ==============================================
  # POSTGRES - Development Overrides
  # ==============================================
  postgres:
    environment:
      # Logs de queries para debug
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      # Dados persistentes em desenvolvimento
      - postgres-dev-data:/var/lib/postgresql/data
    ports:
      # Expor porta para acesso externo
      - "5433:5432"

  # ==============================================
  # JUPYTER NOTEBOOK SERVICE (Development Only)
  # ==============================================
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${AIRFLOW_UID:-50000}:0"
    env_file:
      - .env
    environment:
      JUPYTER_ENABLE_LAB: 'yes'
      JUPYTER_TOKEN: 'desenvolvimento'
    command: |
      bash -c "
        pip install jupyterlab &&
        jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='desenvolvimento'
      "
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./base_dados:/home/jovyan/work/base_dados
      - ./Resultados:/home/jovyan/work/Resultados
      - ./spark_config:/home/jovyan/work/spark_config
    networks:
      - airflow-network
    profiles:
      - jupyter

  # ==============================================
  # SUPERSET - Development Overrides
  # ==============================================
  superset:
    environment:
      # Debug mode para desenvolvimento
      SUPERSET_ENV: development
      SUPERSET_LOAD_EXAMPLES: 'yes'
      FLASK_ENV: development
    volumes:
      # Volume para persistência de dashboards em desenvolvimento
      - superset-dev-data:/app/superset_home

volumes:
  postgres-dev-data:
    driver: local
  superset-dev-data:
    driver: local

# ==============================================
# USAGE INSTRUCTIONS
# ==============================================
# 
# Para usar este arquivo de override:
# 
# 1. Desenvolvimento normal (Airflow completo):
#    docker-compose up -d
# 
# 2. Apenas Superset (leve):
#    docker-compose --profile superset up -d
#    Acesso: http://localhost:8088
#    Usuário: admin | Senha: admin
# 
# 3. Com Jupyter Lab:
#    docker-compose --profile jupyter up -d
#    Acesse: http://localhost:8888 (token: desenvolvimento)
# 
# 4. Superset + Jupyter:
#    docker-compose --profile superset --profile jupyter up -d
# 
# 5. Debug completo:
#    docker-compose logs -f
#
# 6. Parar apenas Superset:
#    docker-compose --profile superset down
#
# 7. Conectar Superset a bancos externos:
#    PostgreSQL do Airflow (se estiver rodando):
#    - URI: postgresql://airflow:airflow@postgres:5432/airflow
#    
#    PostgreSQL do Superset (standalone):
#    - Host: postgres-superset (interno) ou localhost:5434 (externo)
#    - Database: superset
#    - Username: superset | Password: superset
#