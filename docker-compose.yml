# ==============================================
# Base configuration for Airflow services
# ==============================================
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  env_file:
    - .env
  environment: &airflow-common-env
    # Core Configuration
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__TEST_CONNECTION: Enabled
    AIRFLOW__CORE__DEFAULT_TIMEZONE: ${AIRFLOW__CORE__DEFAULT_TIMEZONE}
    AIRFLOW__CORE__ENABLE_XCOM_PICKLING: 'true'
    AIRFLOW__CORE__PLUGINS_FOLDER: ${AIRFLOW_HOME}/plugins
    AIRFLOW__CORE__DAGS_FOLDER: ${AIRFLOW_HOME}/dags
    
    # Database Configuration
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}/${POSTGRES_DB}
    
    # API Configuration
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    
    # WebServer Configuration
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: ${AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE}
    AIRFLOW__WEBSERVER__INSTANCE_NAME: "${PROJECT_NAME} - Local Dev"
    AIRFLOW__WEBSERVER__NAVBAR_COLOR: '#1f77b4'
    AIRFLOW__WEBSERVER__RELOAD_ON_PLUGIN_CHANGE: 'true'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'your-secret-key-here'
    
    # Scheduler Configuration
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    
    # Email Configuration
    AIRFLOW__EMAIL__DEFAULT_EMAIL_ON_RETRY: 'false'
    AIRFLOW__EMAIL__DEFAULT_EMAIL_ON_FAILURE: 'false'
    
    # Python Path
    PYTHONPATH: "/opt/airflow/spark_config:/opt/airflow/data_layer/raw:/opt/airflow/dags:/opt/airflow/plugins:/opt/airflow/postgres/helpers:/opt/airflow/postgres/plugins:$PYTHONPATH"
    
    # Spark Configuration
    SPARK_HOME: ${SPARK_HOME}
    PYSPARK_PYTHON: ${PYSPARK_PYTHON}
    PYSPARK_DRIVER_PYTHON: ${PYSPARK_DRIVER_PYTHON}
    
    # Init Configuration
    _AIRFLOW_DB_MIGRATE: 'true'
    _AIRFLOW_WWW_USER_CREATE: 'true'
    _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME}
    _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
    
    # Additional Requirements
    _PIP_ADDITIONAL_REQUIREMENTS: ''
    
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/dags:${AIRFLOW_HOME}/dags
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/logs:${AIRFLOW_HOME}/logs
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/config:${AIRFLOW_HOME}/config
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/plugins:${AIRFLOW_HOME}/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/data_layer:${AIRFLOW_HOME}/data_layer
    - ${AIRFLOW_PROJ_DIR:-.}/transformer:${AIRFLOW_HOME}/transformer
    - ${AIRFLOW_PROJ_DIR:-.}/spark_config:${AIRFLOW_HOME}/spark_config
    - ${AIRFLOW_PROJ_DIR:-.}/notebooks:${AIRFLOW_HOME}/notebooks
    - ${AIRFLOW_PROJ_DIR:-.}/postgres:${AIRFLOW_HOME}/postgres
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

# ==============================================
# SERVICES
# ==============================================
services:
  # ==============================================
  # DATABASE SERVICE
  # ==============================================
  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - airflow-network
    profiles:
      - airflow

  # ==============================================
  # AIRFLOW WEBSERVER
  # ==============================================
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - airflow-network
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    profiles:
      - airflow

  # ==============================================
  # ONE-SHOT: TRIGGER ALL DAGS (executa uma vez após webserver estar healthy)
  # ==============================================
  airflow-trigger:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "🔁 Executando trigger_all_dags.sh para acionar todas as DAGs..."
        bash /opt/airflow/trigger_all_dags.sh || true
    depends_on:
      airflow-webserver:
        condition: service_healthy
    restart: 'no'
    networks:
      - airflow-network
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/airflow/trigger_all_dags.sh:/opt/airflow/trigger_all_dags.sh:ro
    profiles:
      - airflow

  # ==============================================
  # AIRFLOW SCHEDULER
  # ==============================================
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - airflow-network
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    profiles:
      - airflow

  # ==============================================
  # AIRFLOW INIT
  # ==============================================
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "🔧 Inicializando Airflow e ajustando permissões..."
        
        # Criar diretórios necessários
        mkdir -p /sources/logs /sources/dags /sources/plugins /sources/config
        mkdir -p /opt/airflow/data_layer/raw/Resultados /opt/airflow/data_layer/silver /opt/airflow/notebooks
        
        # Ajustar permissões dos diretórios do Airflow
        chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins,config}
        chmod -R 777 /sources/{logs,dags,plugins,config}
        
        # Ajustar permissões dos diretórios de dados
        chmod -R 777 /opt/airflow/data_layer || true
        chmod -R 777 /opt/airflow/notebooks || true
        
        echo "✅ Permissões ajustadas!"
        
        # Inicializar Airflow
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _PIP_ADDITIONAL_REQUIREMENTS: ''
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
    user: "0:0"
    networks:
      - airflow-network
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/airflow:/sources
      - ${AIRFLOW_PROJ_DIR:-.}/data_layer:/opt/airflow/data_layer
      - ${AIRFLOW_PROJ_DIR:-.}/notebooks:/opt/airflow/notebooks
    profiles:
      - airflow

  # ==============================================
  # AIRFLOW CLI (DEBUG PROFILE)
  # ==============================================
  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow
    networks:
      - airflow-network

  # ==============================================
  # POSTGRES FOR SUPERSET (Standalone)
  # ==============================================
  postgres-superset:
    image: postgres:15-alpine
    container_name: postgres-superset
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - postgres-superset-volume:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - airflow-network
    profiles:
      - superset

  # ==============================================
  # APACHE SUPERSET (Standalone)
  # ==============================================
  superset:
    image: apache/superset:latest
    container_name: superset
    environment:
      - SUPERSET_SECRET_KEY=your-superset-secret-key-change-in-production
      - SUPERSET_LOAD_EXAMPLES=yes
      - DATABASE_DIALECT=postgresql
      - DATABASE_USER=superset
      - DATABASE_PASSWORD=superset
      - DATABASE_HOST=postgres-superset
      - DATABASE_PORT=5432
      - DATABASE_DB=superset
      - SQLALCHEMY_DATABASE_URI=postgresql://superset:superset@postgres-superset:5432/superset
    ports:
      - "8088:8088"
    volumes:
      - superset-data:/app/superset_home
    networks:
      - airflow-network
    restart: always
    depends_on:
      postgres-superset:
        condition: service_healthy
    command: >
      bash -c "
      superset db upgrade &&
      (superset fab create-admin --username admin --firstname Admin --lastname User --email admin@superset.com --password admin 2>/dev/null || echo 'Admin user already exists') &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    profiles:
      - superset

# ==============================================
# VOLUMES
# ==============================================
volumes:
  postgres-db-volume:
    driver: local
  airflow-logs:
    driver: local
  superset-data:
    driver: local
  postgres-superset-volume:
    driver: local

# ==============================================
# NETWORKS
# ==============================================
networks:
  airflow-network:
    driver: bridge
